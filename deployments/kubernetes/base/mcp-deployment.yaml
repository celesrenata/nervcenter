# NerveCenter MCP server deployment (spec §45). Serves the §45 tool list over
# JSON-RPC 2.0 (uvicorn mcp.core:app — POST /mcp, GET /mcp/health) and proxies
# every tool call to the api service in-cluster. Image tag is set by the
# operator (deploy.sh patches it with the git short SHA before `kubectl
# apply -k`); the placeholder tag `latest` is the deploy.sh fallback when git
# is unavailable.
#
# envFrom: nervcenter-config (ConfigMap — APP_ENV, LOG_LEVEL, NERVE_MCP_API,
#          which points the §46 proxy at the api service). The nervecenter-env
#          secret is not needed: the MCP server holds no credentials of its own.
# imagePullSecrets: harbor-pull (per-namespace copy; see deployments/README.md).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp
  namespace: nervecenter
  labels:
    app: nervcenter
    app.kubernetes.io/name: mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mcp
  template:
    metadata:
      labels:
        app: mcp
    spec:
      containers:
        - name: mcp
          # Pinned to the cluster-running image (kubectl -n nervecenter get
          # deploy mcp -o jsonpath='...containers[0].image' on 2026-10-08);
          # a later `kubectl apply -k` with the :latest placeholder would
          # break mcp with ImagePullBackOff (no such tag in Harbor).
          image: "registry.celestium.life/nervecenter/mcp:50e4c83"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: nervcenter-config
          readinessProbe:
            httpGet:
              path: /mcp/health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /mcp/health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              memory: "128Mi"
              cpu: "0.1"
            limits:
              memory: "512Mi"
              cpu: "0.5"
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
      imagePullSecrets:
        - name: harbor-pull
