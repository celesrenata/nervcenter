# Ingress for nervecenter.celestium.life (Traefik / cert-manager cluster-wide).
#
# STATUS: SSO (Keycloak) gate is STAGED BUT NOT YET FRONTING this ingress.
#
#   The oauth2-proxy gate (`nervecenter-oauth`, see oauth-deployment.yaml /
#   oauth-service.yaml) is deployed and healthy, but as of 2026-10-10 the
#   Keycloak client `nervecenter` does not exist in realm `celestium` on
#   sso.celestium.life — the auth endpoint returns 400 "Client not found"
#   (realm discovery is live/200, so only the client record is missing).
#   Pointing the ingress at the gate would therefore send every unauth
#   visitor to a Keycloak error page, so the ingress is routed DIRECTLY to
#   the app until the client is created.
#
#   TO RE-ENABLE SSO once the client exists: change the `/` backend below
#   from `web:80` back to `nervecenter-oauth:4180` (and drop the `/api/`
#   direct path, since the gate upstreams to web which already fans /api/
#   out to the api service), then re-apply. See deployments/README.md
#   "SSO (Keycloak)" for the full note and re-enable steps.
#
# Route map (current — direct, no SSO):
#   /api/  -> api  (:8000)  OPEN
#   /mcp/  -> mcp  (:8000)  OPEN  (programmatic MCP JSON-RPC API)
#   /      -> web  (:80)    OPEN  (nginx SPA + static bundles)
#
# cert-manager picks up TLS automatically via the `cert-manager.io/cluster-issuer`
# annotation (issuer `celestium-le-production` is the cluster-wide standard for
# *.celestium.life). If you want a different issuer (e.g. internal CA), swap
# the annotation.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nervcenter-celestium
  namespace: nervecenter
  labels:
    app: nervcenter
    app.kubernetes.io/name: ingress
  annotations:
    cert-manager.io/cluster-issuer: celestium-le-production
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - nervecenter.celestium.life
      secretName: nervecenter-celestium-tls
  rules:
    - host: nervecenter.celestium.life
      http:
        paths:
          - path: /api/
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 8000
          # OPEN: programmatic MCP JSON-RPC API, direct — see header note.
          - path: /mcp/
            pathType: Prefix
            backend:
              service:
                name: mcp
                port:
                  number: 8000
          # Direct to the app for now — SSO gate pending Keycloak client.
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 80
