# NerveCenter ConfigMap

apiVersion: v1
kind: ConfigMap
metadata:
  name: nervcenter-config
  labels:
    app: nervcenter
data:
  # Application configuration
  APP_ENV: "production"
  LOG_LEVEL: "INFO"
  
  # Database configuration
  DATABASE_HOST: "localhost"
  DATABASE_PORT: "5432"
  DATABASE_NAME: "nervcenter"
  
  # Redis configuration
  REDIS_HOST: "localhost"
  REDIS_PORT: "6379"
  
  # Service endpoints
  API_PORT: "8080"