# Kustomize entrypoint for the NerveCenter cluster install.
#
#   kubectl apply -k deployments/kubernetes
#
# The full resource set lives in base/; this file is a pass-through so both
# `apply -k deployments/kubernetes` and `apply -k deployments/kubernetes/base`
# resolve to the same objects.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - base
